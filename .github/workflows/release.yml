name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Check version and existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version '$version' in Directory.Build.props" }
          $changelog = Get-Content -Raw CHANGELOG.md
          $match = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\]\s*\r?\n(.*?)(?=^## \[|\z)")
          if (!$match.Success) { throw "CHANGELOG.md has no ## [$version] entry" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/release" | Out-Null
          $notes = $match.Groups[1].Value.Trim() + "`n`nSource: https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA"
          Set-Content -Encoding utf8 "$env:RUNNER_TEMP/release/notes.md" $notes
          $tag = "v$version-$($env:GITHUB_SHA.Substring(0, 12))"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $private = git ls-files -- docs artifacts releases game_data '*.save' '*.bak' 'native/bin/*' 'resources/**/*.png' 'resources/**/*.webp' 'resources/**/*.dds'
          if ($private) { throw "Private data or build output is tracked: $($private -join ', ')" }
          $releases = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[] | [.tag_name, .draft, .target_commitish] | @tsv'
          if ($LASTEXITCODE) { throw 'Could not check existing releases' }
          $existing = $releases | Where-Object { ($_ -split "`t")[0] -eq $tag }
          if ($existing -and ($existing -split "`t")[1] -eq 'false') {
            'publish=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($existing -and ($existing -split "`t")[2] -ne $env:GITHUB_SHA) {
            throw 'Existing draft belongs to another commit; resolve it before retrying'
          }
          $tagExists = git tag --list $tag
          if ($tagExists -and (git rev-list -n 1 $tag) -ne $env:GITHUB_SHA) {
            throw 'Existing version tag points to another commit'
          }
          "draft=$([bool]$existing)" >> $env:GITHUB_OUTPUT
          'publish=true' >> $env:GITHUB_OUTPUT
      - name: Build, test and publish single-file EXE
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          # The runner image ships MinGW-w64 GCC; the native DLLs are built from native/ with it.
          $candidates = @('C:/mingw64/bin', 'C:/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin', 'C:/ProgramData/mingw64/mingw64/bin')
          $gxx = Get-Command g++ -ErrorAction SilentlyContinue
          if ($gxx) { $candidates = @(Split-Path $gxx.Source) + $candidates }
          $toolchain = $candidates | Where-Object { (Test-Path "$_/g++.exe") -and (Test-Path "$_/mingw32-make.exe") } | Select-Object -First 1
          if (!$toolchain) { throw 'MinGW-w64 g++ and mingw32-make were not found on the runner' }
          & "$toolchain/g++.exe" --version | Select-Object -First 1
          ./scripts/Build.ps1 -ToolchainDirectory $toolchain -Test -Publish -OutputDirectory "releases/SaveUltimate-$env:RELEASE_VERSION"
          Compress-Archive -Path "releases/SaveUltimate-$env:RELEASE_VERSION/*" -DestinationPath "releases/SaveUltimate-$env:RELEASE_VERSION-windows-x64.zip"
      - name: Upload and publish release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          EXISTING_DRAFT: ${{ steps.release.outputs.draft }}
        run: |
          if ($env:EXISTING_DRAFT -ne 'True') {
            gh release create $env:RELEASE_TAG --draft --target $env:GITHUB_SHA --title "SaveUltimate $env:RELEASE_TAG" --notes-file "$env:RUNNER_TEMP/release/notes.md"
            if ($LASTEXITCODE) { throw 'Could not create release draft' }
          }
          gh release upload $env:RELEASE_TAG "releases/SaveUltimate-$env:RELEASE_VERSION-windows-x64.zip" --clobber
          if ($LASTEXITCODE) { throw 'Could not upload release package' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE) { throw 'Could not publish release' }
